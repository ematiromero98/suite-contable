<style>

    --gold:#FCBC45; --black:#141413; --white:#FFFFFF; --cream:#FAF9F5; --gray:#808080;

    --e-launcher:#FCBC45; --e-dep:#8E44AD; --e-data:#16A085; --e-infra:#2E86C1;
    --panel:#FFFFFFEE; --line:#e7e3d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Poppins',system-ui,sans-serif;color:var(--black);background:var(--cream);overflow:hidden}

  canvas{display:block}
  /* ---- Top bar ---- */

  #brand{display:flex;align-items:center;gap:10px;pointer-events:auto}
  #brand .dot{width:26px;height:26px;border-radius:7px;background:var(--gold);box-shadow:0 2px 8px #0002}
  #brand b{font-weight:700;font-size:15px;letter-spacing:.2px}
  #brand span{font-size:11px;color:var(--gray);display:block;margin-top:-2px}
  #filters{display:flex;gap:6px;margin-left:8px;pointer-events:auto;flex-wrap:wrap}
  .fbtn{font-family:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--white);
    color:var(--black);padding:7px 13px;border-radius:20px;cursor:pointer;transition:.15s;white-space:nowrap;box-shadow:0 1px 3px #0001}
  .fbtn:hover{border-color:var(--gold)}
  .fbtn.active{background:var(--black);color:var(--white);border-color:var(--black)}
  .fbtn .cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  /* ---- Left sidebar ---- */
  #sidebar{position:absolute;top:64px;left:12px;width:250px;max-height:calc(100% - 150px);z-index:15;
    background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 8px 30px #0001;overflow:auto;padding:6px 0}
  .grp-h{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--gray);
    padding:10px 14px 4px}
  .row{display:flex;align-items:center;gap:9px;padding:7px 14px;cursor:pointer;transition:.12s;border-left:3px solid transparent}
  .row:hover{background:#00000008}
  .row.sel{background:#FCBC4522;border-left-color:var(--gold)}
  .row .st{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .row .nm{font-size:13px;font-weight:500;flex:1;line-height:1.15}
  .row .fc{font-size:10.5px;color:var(--gray);flex:0 0 auto}
  .row.lm .nm{color:var(--e-infra);font-weight:600}
  /* ---- filter panel ---- */
  #filterpanel{padding:11px 13px 6px;border-bottom:1px solid var(--line)}
  .fp-grp{margin-bottom:10px}
  .fp-h{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin-bottom:6px}
  .fp-hint{text-transform:none;letter-spacing:0;font-weight:400;opacity:.7}
  .fp-chips{display:flex;flex-wrap:wrap;gap:5px}
  .fchip{font-family:inherit;font-size:11px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--black);
    padding:4px 9px;border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.12s}
  .fchip i{width:8px;height:8px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .fchip:hover{border-color:var(--gold)}
  .fchip.off{opacity:.45;text-decoration:line-through;background:#00000006}
  .fp-row{display:flex;align-items:center;justify-content:space-between;margin-top:2px}
  .switch{position:relative;display:inline-block;width:38px;height:20px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch .sl{position:absolute;inset:0;background:#cfcabd;border-radius:20px;transition:.15s;cursor:pointer}
  .switch .sl:before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px #0003}
  .switch input:checked + .sl{background:var(--gold)}
  .switch input:checked + .sl:before{transform:translateX(18px)}

  #detail{position:absolute;top:64px;right:12px;width:330px;max-height:calc(100% - 150px);z-index:15;
    background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;

  #detail .dh h2{margin:0;font-size:17px;font-weight:700}
  #detail .dh .sub{font-size:12px;color:var(--gray);margin-top:2px}

  .chip{font-size:11px;font-weight:500;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--white)}
  .chip.ver{background:var(--black);color:#fff;border-color:var(--black)}

  .tab{flex:1;text-align:center;font-size:12.5px;font-weight:500;padding:11px 8px;cursor:pointer;color:var(--gray);border-bottom:2px solid transparent}
  .tab.active{color:var(--black);border-bottom-color:var(--gold);font-weight:600}
  .tabc{padding:15px 16px 20px;display:none;font-size:13px;line-height:1.55}
  .tabc.active{display:block}
  .tabc h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray)}
  .tabc p{margin:0 0 12px}
  .files{list-style:none;margin:0;padding:0}
  .files li{font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace;font-size:11.5px;background:#00000006;
    border:1px solid var(--line);border-radius:6px;padding:5px 8px;margin-bottom:5px;color:#333}
  .store{list-style:none;margin:0 0 12px;padding:0}
  .store li{font-size:12px;line-height:1.45;background:#00000005;border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;margin-bottom:6px}
  .store li code{font-family:'IBM Plex Mono',monospace;font-size:11px;background:#0000000a;padding:1px 5px;border-radius:4px}
  .store-note{background:#eaf3fb;border:1px solid #cfe2f3;border-radius:8px;padding:9px 11px;font-size:12.5px}
  .store-note code{font-family:'IBM Plex Mono',monospace;font-size:11px;background:#ffffff99;padding:1px 5px;border-radius:4px}
  .kv{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .kv b{font-weight:600}
  .conns{margin-top:6px}
  .conn{font-size:11.5px;padding:6px 8px;border-radius:7px;margin-bottom:5px;background:#00000005;border:1px solid var(--line)}
  .conn .ar{font-weight:700}
  /* ---- Bottom bar ---- */
  #bottom{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:16px;

    box-shadow:0 6px 24px #0001;padding:10px 14px;display:flex;align-items:center;gap:12px}
  .ctrl{gap:8px}
  .ctrl button{font-family:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--white);
    color:var(--black);width:38px;height:34px;border-radius:9px;cursor:pointer;transition:.12s;display:flex;align-items:center;justify-content:center}
  .ctrl button:hover{border-color:var(--gold)}
  .ctrl button.play{width:auto;padding:0 14px;gap:6px}
  .ctrl .spd{display:flex;gap:3px}
  .ctrl .spd b{font-size:11px;font-weight:500;padding:8px 9px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--white)}
  .ctrl .spd b.on{background:var(--black);color:#fff;border-color:var(--black)}
  .legend{gap:16px;font-size:11px}
  .legend .col{display:flex;flex-direction:column;gap:5px}
  .legend .li{display:flex;align-items:center;gap:7px;white-space:nowrap}
  .legend .sw{width:16px;height:0;border-top:3px solid #000;border-radius:2px}
  .legend .sq{width:11px;height:11px;border-radius:3px}
  .legend .ttl{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);font-weight:600;margin-bottom:1px}

  .barrio-label.per{background:#E91E6318;border-color:#E91E63;color:#a01446}
  .barrio-label.ext{background:#ffffff;border:1.5px dashed var(--gray);color:var(--gray);font-size:12px}
  .b-label{font-family:'Poppins';font-weight:600;font-size:12px;color:#141413;background:#ffffffe8;
    padding:3px 9px;border-radius:12px;white-space:nowrap;pointer-events:none;border:1px solid #00000014;box-shadow:0 1px 4px #0001}
  .b-label.dim{opacity:.28}
  .b-label.gone{visibility:hidden;opacity:0}
  .b-label.hi{background:var(--black);color:#fff;font-weight:700;box-shadow:0 3px 10px #0003}
  .b-label.lm{color:#1a4e73;font-weight:700;font-size:12.5px;background:#eaf3fbee;border-color:#2E86C155}

    padding:3px 8px;border-radius:9px;white-space:nowrap;pointer-events:none;box-shadow:0 2px 8px #0003;
    opacity:0}
  .pay-label.on{opacity:1}
  #tooltip{position:absolute;z-index:30;pointer-events:none;background:var(--black);color:#fff;font-size:12px;
    font-weight:500;padding:6px 10px;border-radius:8px;transform:translate(-50%,-140%);display:none;white-space:nowrap;box-shadow:0 4px 14px #0004}
  #hint{position:absolute;bottom:14px;left:14px;z-index:15;font-size:11px;color:var(--gray);background:#ffffffcc;
    border:1px solid var(--line);border-radius:10px;padding:7px 11px;line-height:1.5;max-width:220px}
  #css2d{position:absolute;inset:0;z-index:10;pointer-events:none;overflow:hidden}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#0002;border-radius:8px}
</style>
</head>

<div id="app"></div>
<div id="css2d"></div>
<div id="tooltip"></div>

<div id="topbar">
  <div id="brand"><div class="dot"></div><div><b>Ecosistema de Proyectos</b><span>15 repos · ciudad isométrica 3D</span></div></div>

</div>

    <div class="chips" id="d-chips"></div>
  </div>
  <div class="tabs">
    <div class="tab active" data-t="que">Qué hace</div>
    <div class="tab" data-t="como">Cómo está construido</div>
  </div>
  <div class="tabc active" id="tc-que"></div>
  <div class="tabc" id="tc-como"></div>
</div>

<div id="bottom">
  <div class="card ctrl">
    <button class="play" id="btn-play">▶ <span id="play-lbl">Play</span></button>
    <button id="btn-step" title="Paso a paso">⏭</button>
    <div class="spd">
      <b data-s="0.5">0.5x</b><b data-s="1" class="on">1x</b><b data-s="2">2x</b>
    </div>
  </div>
  <div class="card legend">
    <div class="col">
      <div class="ttl">Conexiones</div>
      <div class="li"><span class="sw" style="border-color:var(--e-launcher)"></span>Launcher / trigger</div>
      <div class="li"><span class="sw" style="border-color:var(--e-data)"></span>Flujo de datos</div>
    </div>
    <div class="col">
      <div class="ttl">&nbsp;</div>
      <div class="li"><span class="sw" style="border-color:var(--e-infra)"></span>Infra compartida</div>
      <div class="li"><span class="sw" style="border-color:var(--e-dep)"></span>Dependencia</div>
    </div>
    <div class="col">
      <div class="ttl">Estado</div>
      <div class="li"><span class="sq" style="background:var(--prod)"></span>Producción</div>
      <div class="li"><span class="sq" style="background:var(--mvp)"></span>MVP</div>
    </div>
    <div class="col">
      <div class="ttl">&nbsp;</div>
      <div class="li"><span class="sq" style="background:var(--proto)"></span>Prototipo</div>
      <div class="li"><span class="sq" style="background:var(--black)"></span>Infra (landmark)</div>
    </div>
  </div>
</div>

<div id="hint"><b>Arrastrar</b> rota · <b>scroll</b> zoom · <b>click</b> detalle · <b>ESC</b> limpia selección</div>

const edgeObjs = []; // {line, dots:[], type, from, to, payload, payLabel}
const dotGeo = new THREE.SphereGeometry(1.15,10,10);

for(const [from,to,type,payload] of EDGES){
  const a = nodeObjs[from].top.clone();
  const b = nodeObjs[to].top.clone();
  const mid = a.clone().add(b).multiplyScalar(0.5);
  const dist = a.distanceTo(b);
  mid.y += Math.min(38, 12 + dist*0.28);
  const curve = new THREE.QuadraticBezierCurve3(a.clone().setY(a.y+1), mid, b.clone().setY(b.y+1));
  const col = EDGE_COLOR[type];
  const pts = curve.getPoints(40);
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
    new THREE.LineBasicMaterial({ color:col, transparent:true, opacity:.32 }));
  scene.add(line);

  const dots = [];
  const nDots = type==='launcher'?1:2;
  for(let i=0;i<nDots;i++){
    const d = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({ color:col }));
    d.userData.p = i/nDots + Math.random()*0.15;
    scene.add(d); dots.push(d);
  }
  // payload label (hidden until focus) — se togglea por .visible del objeto,
  // NO por style.display (CSS2DRenderer reescribe display cada frame según .visible)
  const pel = document.createElement('div'); pel.className='pay-label'; pel.textContent=payload;
  const plo = new CSS2DObject(pel); plo.position.copy(mid); scene.add(plo);

  edgeObjs.push({ line, dots, curve, type, from, to, payload, payLabel:pel, payLabelObj:plo, mid });
}

/* ============================================= NEIGHBORS / STATE ========= */
function neighborsOf(id){
  const s = new Set([id]);
  for(const e of edgeObjs){ if(e.from===id) s.add(e.to); if(e.to===id) s.add(e.from); }
  return s;
}
let activeBarrio = 'todos';
let selected = null;
let playing = true;
let speed = 1;
// filtros extra
const estadoOn = { prod:true, mvp:true, proto:true };
const typeOn   = { launcher:true, data:true, infra:true, dep:true };
let showPayloads = true;

function projPasses(n){
  if(n.estado && !estadoOn[n.estado]) return false;
  if(activeBarrio!=='todos' && n.barrio!==activeBarrio) return false;
  return true;
}
function nodeVisibleByFilter(n){
  if(n.ghost) return activeBarrio==='todos';
  if(n.landmark){
    // visible si conecta con algún proyecto (no-landmark) que pase los filtros
    return EDGES.some(([f,t])=>{
      const other = f===n.id? t : (t===n.id? f : null);
      return other && NMAP[other] && !NMAP[other].landmark && nodeVisibleByFilter(NMAP[other]);
    });
  }
  return projPasses(n);
}

function apply(){
  const nb = selected? neighborsOf(selected): null;
  // nodes
  for(const n of NODES){
    const o = nodeObjs[n.id]; if(!o) continue;
    const vis = nodeVisibleByFilter(n);
    const dim = nb && !nb.has(n.id);
    o.mesh.visible = vis;
    if(o.roof) o.roof.visible = vis;
    if(o.cap) o.cap.visible = vis;
    const op = dim?0.16:1;
    setOpacity(o.mesh, op);
    if(o.roof) setOpacity(o.roof, op);
    if(o.cap) setOpacity(o.cap, op);
    o.label.style.setProperty('opacity', !vis ? '0' : (dim ? '0.28' : '1'), 'important');
    o.label.classList.toggle('hi', selected===n.id);
  }
  // edges
  for(const e of edgeObjs){
    const fv = nodeVisibleByFilter(NMAP[e.from]), tv = nodeVisibleByFilter(NMAP[e.to]);
    const vis = fv && tv && typeOn[e.type];
    const active = vis && (!selected || e.from===selected || e.to===selected);
    e.line.visible = vis;
    e.line.material.opacity = active?0.7:(vis?0.12:0);
    e.dots.forEach(d=>{ d.visible = active; });
    e.payLabel.style.setProperty('opacity', (showPayloads && active && selected) ? '1' : '0', 'important');
  }
}
function setOpacity(m,o){ if(!m.material) return; m.material.transparent = o<1; m.material.opacity=o; }

function buildSidebar(){
  projlist.innerHTML='';
  const groups = [
    ['MR & Asociados', NODES.filter(n=>n.barrio==='mrasoc')],
    ['NTT DATA', NODES.filter(n=>n.barrio==='ntt')],
    ['Personal', NODES.filter(n=>n.barrio==='per')],
    ['Infraestructura', NODES.filter(n=>n.landmark)],
    ['Externo', NODES.filter(n=>n.ghost)],
  ];
  for(const [g,list] of groups){
    if(!list.length) continue;
    const h=document.createElement('div'); h.className='grp-h'; h.textContent=g; projlist.appendChild(h);
    for(const n of list){
      const r=document.createElement('div'); r.className='row'+(n.landmark||n.ghost?' lm':''); r.dataset.id=n.id;
      const st = n.landmark? '#141413' : n.ghost? '#bfb9ac' : '#'+EST_COLOR[n.estado].toString(16).padStart(6,'0');
      r.innerHTML = `<span class="st" style="background:${st}"></span>`+
        `<span class="nm">${n.name}</span>`+
        (n.files?`<span class="fc">${n.files}</span>`:'');
      r.onclick=()=>selectNode(n.id,true);
      projlist.appendChild(r);
    }
  }
}
buildSidebar();

// detail
const detail = document.getElementById('detail');
function showDetail(n){
  document.getElementById('d-name').textContent = n.name;
  document.getElementById('d-repo').textContent = n.repo? 'github.com/'+n.repo : (n.landmark?'infraestructura compartida':'externo · no-repo');
  const chips = document.getElementById('d-chips'); chips.innerHTML='';
  const add=(t,cls='')=>{ const c=document.createElement('span'); c.className='chip '+cls; c.innerHTML=t; chips.appendChild(c); };
  if(n.ver && n.ver!=='—') add(n.ver,'ver');
  if(n.estado) add(`<span style="color:#${EST_COLOR[n.estado].toString(16)}">●</span> ${EST_LABEL[n.estado]}`);
  if(n.stack) add(n.stack);
  if(n.files) add(n.files+' archivos');
  if(n.loc) add(n.loc.toLocaleString('es-AR')+' líneas');
  if(n.mod) add('↻ '+n.mod);
  // qué
  let que = `<h4>En criollo</h4><p>${n.que||'—'}</p>`;
  if(n.guarda && n.guarda.length){
    que += `<h4>${n.landmark?'Qué guarda / qué hay acá':'Qué guarda'}</h4><ul class="store">`+n.guarda.map(g=>`<li>${g}</li>`).join('')+`</ul>`;
  }
  if(n.flujos && n.flujos.length){
    que += `<h4>Qué pasa por acá</h4><div class="conns">`+n.flujos.map(([id,txt])=>{
      const nm = NMAP[id]?NMAP[id].name:id;
      const col = NMAP[id]&&NMAP[id].estado?'#'+EST_COLOR[NMAP[id].estado].toString(16):'#2E86C1';
      return `<div class="conn" style="border-left:3px solid ${col}"><b>${nm}</b><br><span style="color:#808080">${txt}</span></div>`;
    }).join('')+`</div>`;
  } else {
    que += connHTML(n);
  }
  document.getElementById('tc-que').innerHTML = que;
  // cómo
  let como = `<h4>Stack &amp; construcción</h4><p>${n.como||('<i>'+(n.stack||'')+'</i>')}</p>`;
  if(n.data){ como += `<h4>Dónde persiste la data</h4><p class="store-note">${n.data}</p>`; }
  if(n.key && n.key.length){
    como += `<h4>Archivos clave</h4><ul class="files">`+n.key.map(f=>`<li>${f}</li>`).join('')+`</ul>`;
  }
  document.getElementById('tc-como').innerHTML = como;
  detail.classList.add('show');
  // reset tab
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.t==='que'));
  document.getElementById('tc-que').classList.add('active');
  document.getElementById('tc-como').classList.remove('active');
}
function connHTML(n){
  const outs = EDGES.filter(e=>e[0]===n.id), ins = EDGES.filter(e=>e[1]===n.id);
  if(!outs.length && !ins.length) return '';
  let h = '<h4>Conexiones</h4><div class="conns">';
  for(const [f,t,ty,p] of outs) h += `<div class="conn" style="border-left:3px solid #${EDGE_COLOR[ty].toString(16)}"><span class="ar">→</span> ${NMAP[t].name}<br><span style="color:#808080">${p}</span></div>`;
  for(const [f,t,ty,p] of ins) h += `<div class="conn" style="border-left:3px solid #${EDGE_COLOR[ty].toString(16)}"><span class="ar">←</span> ${NMAP[f].name}<br><span style="color:#808080">${p}</span></div>`;
  return h+'</div>';
}
function hideDetail(){ detail.classList.remove('show'); }

function selectNode(id, fromList){
  selected = id;
  [...sb.querySelectorAll('.row')].forEach(r=>r.classList.toggle('sel',r.dataset.id===id));
  showDetail(NMAP[id]);
  apply();
  if(fromList) focusOn(id);
}
function clearSel(){ selected=null; [...sb.querySelectorAll('.row')].forEach(r=>r.classList.remove('sel')); hideDetail(); apply(); }

const btnPlay=document.getElementById('btn-play'), playLbl=document.getElementById('play-lbl');
btnPlay.onclick=()=>{ playing=!playing; btnPlay.firstChild.textContent = playing?'▶ ':'⏸ '; playLbl.textContent = playing?'Play':'Pausa'; };
document.getElementById('btn-step').onclick=()=>{ stepOnce(); };
document.querySelectorAll('.spd b').forEach(b=>b.onclick=()=>{
  speed=parseFloat(b.dataset.s); document.querySelectorAll('.spd b').forEach(x=>x.classList.remove('on')); b.classList.add('on');
});

/* ======================================================= INTERACTION ===== */
const tooltip = document.getElementById('tooltip');
const mouse = new THREE.Vector2();
let hovered = null;
renderer.domElement.addEventListener('pointermove', ev=>{
  mouse.x = (ev.clientX/W())*2-1; mouse.y = -(ev.clientY/H())*2+1;
  raycaster.setFromCamera(mouse,camera);
  const hits = raycaster.intersectObjects(buildingMeshes.filter(m=>m.visible));
  if(hits.length){
    const id = hits[0].object.userData.id;
    hovered = id;
    tooltip.style.display='block'; tooltip.style.left=ev.clientX+'px'; tooltip.style.top=ev.clientY+'px';
    tooltip.textContent = NMAP[id].name;
    renderer.domElement.style.cursor='pointer';
  } else { hovered=null; tooltip.style.display='none'; renderer.domElement.style.cursor='grab'; }
});
let downXY=null;
renderer.domElement.addEventListener('pointerdown', ev=>{ downXY=[ev.clientX,ev.clientY]; });
renderer.domElement.addEventListener('pointerup', ev=>{
  if(!downXY) return;
  const moved = Math.hypot(ev.clientX-downXY[0], ev.clientY-downXY[1]);
  downXY=null;
  if(moved>5) return; // was a drag
  if(hovered) selectNode(hovered);
  else clearSel();
});
window.addEventListener('keydown', e=>{ if(e.key==='Escape') clearSel(); });

/* ======================================================= CAMERA FRAMING == */
function frameBarrio(k){
  let tx=-5,tz=0,zoom=0.85;
  if(k==='mrasoc'){ tx=-45; tz=-5; zoom=1.1; }
  else if(k==='ntt'){ tx=55; tz=-15; zoom=1.5; }
  else if(k==='per'){ tx=60; tz=48; zoom=1.9; }
  else { tx=-5; tz=0; zoom=0.82; }
  animateCam(tx,tz,zoom);
}
function focusOn(id){
  const p = nodeObjs[id].top;
  animateCam(p.x, p.z, Math.max(controls.object.zoom,1.3));
}
let camAnim=null;
function animateCam(tx,tz,zoom){
  camAnim={ fromT:controls.target.clone(), toT:new THREE.Vector3(tx,4,tz), fromZ:camera.zoom, toZ:zoom, t:0 };
}

/* ============================================================= LOOP ====== */
const clock = new THREE.Clock();
function stepOnce(){
  for(const e of edgeObjs) for(const d of e.dots){ d.userData.p=(d.userData.p+0.07)%1; }
  updateDotPos();
}
function updateDotPos(){
  for(const e of edgeObjs){
    if(!e.dots[0]||!e.dots[0].visible) continue;
    for(const d of e.dots){ e.curve.getPointAt(d.userData.p, d.position); }
  }
}
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(),0.05);
  if(playing){ for(const e of edgeObjs) for(const d of e.dots){ d.userData.p=(d.userData.p+dt*0.14*speed)%1; } }
  updateDotPos();
  // pulse hubs
  const t = clock.elapsedTime;
  for(const id of ['arca','suite','ntterp']){ const o=nodeObjs[id]; if(o&&o.cap) o.cap.rotation.y=t*0.5; }
  if(camAnim){
    camAnim.t=Math.min(1,camAnim.t+dt*2.2); const e=1-Math.pow(1-camAnim.t,3);
    controls.target.lerpVectors(camAnim.fromT,camAnim.toT,e);
    camera.zoom = camAnim.fromZ+(camAnim.toZ-camAnim.fromZ)*e; camera.updateProjectionMatrix();
    if(camAnim.t>=1) camAnim=null;
  }
  controls.update();
  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
apply(); showIntro(); animate();

window.addEventListener('resize', ()=>{
  const a=W()/H();
  camera.left=-FR*a/2; camera.right=FR*a/2; camera.top=FR/2; camera.bottom=-FR/2;
  camera.updateProjectionMatrix();
  renderer.setSize(W(),H()); labelRenderer.setSize(W(),H());
});
</script>
